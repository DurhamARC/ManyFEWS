name: ManyFEWS
channels:
  - conda-forge
  - defaults
dependencies:
  - numpy>=1.24,<2
  - numba>=0.57.1
  - pandas>=2.0
  - pip
  - psycopg2
  - django>=4.2,<5.1
  - django-leaflet
  - celery>=5.4
  - django-celery-beat
  - django-celery-results
  - django-crispy-forms
  - django-environ
  - twilio
  - tqdm
  - gdal
  - gunicorn
  - tenacity
  - requests
